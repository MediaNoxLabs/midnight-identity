# Scope: our TOML only. The devshell mounts vendored crates under
# third_party/ (read-only nix-store symlinks) — we don't gate or format
# vendored code.
include = [ "**/*.toml" ]
exclude = [ "third_party/**", "target/**", "target-gen/**" ]

[formatting]
align_entries       = true
column_width        = 100
allowed_blank_lines = 1
indent_string       = "  "
array_auto_collapse = false
array_auto_expand   = false
compact_arrays      = false
