[workspace]
resolver = "3"
members  = [ "crates/midnight-did", "crates/midnight-did-api", "crates/midnight-did-cli", "crates/midnight-did-domain", "crates/midnight-did-indexer", "crates/midnight-did-jubjub-schnorr", "crates/midnight-did-method", "crates/midnight-did-resolver", "crates/midnight-did-runtime", "crates/midnight-did-uniffi", "crates/midnight-ledger-source-lock", "crates/midnight-passport-account-source", "crates/midnight-passport-account", "crates/midnight-passport-vault-source", "crates/midnight-vc-domain", "crates/midnight-vc-families", "crates/midnight-vc-proof", "crates/midnight-vc-runtime" ]
exclude  = [ "third_party/midnight-ledger" ]

[workspace.package]
version      = "0.5.0"
edition      = "2024"
rust-version = "1.89"
license      = "Apache-2.0"
authors      = [ "Midnight Foundation" ]
repository   = "https://github.com/MediaNoxLabs/midnight-identity"

[workspace.dependencies]
# Generic, chain-neutral cryptographic primitives. Keep the canary registry
# version exact and its feature cone minimal; Midnight-specific semantics remain
# in this workspace (ADR 0011).
identus-crypto = { version = "=0.1.0-rc.1", default-features = false, features = [ "hash" ] }
# Keep the complete Ledger 8 cone on one immutable source. Compact declares
# these crates through crates.io constraints, so the matching patch table below
# redirects that transitive cone to this same revision.
midnight-base-crypto      = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-coin-structure   = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-onchain-runtime  = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-onchain-state    = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-onchain-vm       = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-serialize        = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-storage          = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-transient-crypto = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-zkir             = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-zswap            = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-ledger           = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
# Compact's runtime and sibling macro crate are resolved together from this
# immutable repository revision. Nix path substitution remains an opt-in local
# acceleration through scripts/cargo-with-nix-overrides.sh.
compact-runtime          = { package = "midnight-compact-runtime", git = "https://github.com/MediaNoxLabs/compact.git", rev = "66ec5f032d2bccbaf2b9c03e5e47d7bd43defe82" }
midnight-compact-runtime = { package = "midnight-compact-runtime", git = "https://github.com/MediaNoxLabs/compact.git", rev = "66ec5f032d2bccbaf2b9c03e5e47d7bd43defe82" }
# common
serde      = { version = "1", features = [ "derive" ] }
serde_json = "1"
hex        = "0.4"
# domain crate (pure-data Midnight DID types)
# `version = "=0.5.0"` is required for `cargo publish` to accept midnight-did-api's
# manifest — crates.io rejects path-only dependencies. The `=` pin keeps the two
# crates lock-stepped: bumping midnight-did-api to 0.1.1 must also bump
# midnight-did-domain to 0.1.1. Same pattern as midnight-compact-runtime + midnight-compact-runtime-macros
# in the codegen-rust toolchain.
midnight-did-domain = { path = "crates/midnight-did-domain", version = "=0.5.0" }
# method crate — Midnight method profile + LedgerToDomain mapper + network mapping.
midnight-did-method = { path = "crates/midnight-did-method", version = "=0.5.0" }
# api crate — consumed by the reference CLI + (future) downstream tooling
midnight-did-api = { path = "crates/midnight-did-api", version = "=0.5.0" }
# runtime crate — codegen target (currently blocked on upstream halo2 skew).
midnight-did-runtime        = { path = "crates/midnight-did-runtime", version = "=0.5.0" }
midnight-did-indexer        = { path = "crates/midnight-did-indexer" }
midnight-did-jubjub-schnorr = { path = "crates/midnight-did-jubjub-schnorr", version = "=0.5.0" }
# Private resolver constraint: exact crates.io requirements force Compact's
# broad Ledger requirements onto the immutable patches above.
midnight-ledger-source-lock = { path = "crates/midnight-ledger-source-lock" }
# umbrella crate — re-exports the full 4-crate stack for monolithic consumers.
midnight-did = { path = "crates/midnight-did", version = "=0.5.0" }
# VC layer (issue #13). `vc-domain` is pure data and publishable on its own
# cadence (hence the `=` version pin, same rationale as midnight-did-domain);
# `vc-runtime` is the codegen target and stays unpublished.
midnight-vc-domain               = { path = "crates/midnight-vc-domain", version = "=0.5.0" }
midnight-vc-families             = { path = "crates/midnight-vc-families" }
midnight-vc-proof                = { path = "crates/midnight-vc-proof" }
midnight-vc-runtime              = { path = "crates/midnight-vc-runtime" }
midnight-passport-account-source = { path = "crates/midnight-passport-account-source", version = "=0.5.0" }
midnight-passport-account        = { path = "crates/midnight-passport-account", version = "=0.5.0" }
midnight-passport-vault-source   = { path = "crates/midnight-passport-vault-source", version = "=0.5.0" }

# ---- Keep Compact's Ledger cone and proofs fork source-coherent ----
#
# Compact expresses its Ledger dependencies as crates.io version constraints.
# Redirect every member of that cone to the same immutable Ledger revision used
# above; otherwise Cargo can resolve duplicate Ledger runtime types from the
# registry and Git sources.
#
# `midnight-ledger/transient-crypto` calls three methods on `ParamsKZG`
# that only exist on a patched fork of `midnight-proofs`:
#   - read_mmap_arc        (mmap-backed SRS)
#   - write_mmap_companion (write the companion mmap file)
#   - read_custom_lazy     (seekable lazy parse, skips g_lagrange)
#
# Upstream `midnight-ledger`'s own Cargo.toml carries a [patch.crates-io]
# entry pointing at a developer-local path. That patch is *not* inherited
# when `midnight-ledger` is consumed as a path-dep from this workspace —
# `cargo` only honours [patch.crates-io] declared at the workspace root.
#
# The midnight-zk fork is also exposed as a flake input (see `flake.nix`),
# materialised via `third_party/midnight-zk` for local inspection. The git
# dependency below is what cargo actually consumes — using a path-dep on
# `third_party/midnight-zk/proofs` doesn't work because that crate's
# `Cargo.toml` inherits from the *fork's* own [workspace.dependencies], and
# `cargo` resolves `workspace = true` against *this* workspace's root, not
# the path-dep's enclosing workspace.
#
# Pinning by rev keeps reproducibility independent of branch movement.
# See `doc/adr/0006-runtime-crate-halo2-block.md` for the full story.
[patch.crates-io]
midnight-base-crypto      = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-coin-structure   = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-onchain-runtime  = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-onchain-state    = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-onchain-vm       = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-serialize        = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-storage          = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-transient-crypto = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-zkir             = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-zswap            = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-ledger           = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "b85f5d8e503fd1d7a1b128bbc1d7156baf823a65" }
midnight-proofs           = { git = "https://github.com/MediaNoxLabs/midnight-zk.git", rev = "532629b044a88473a7175f4a96c2511c91156136" }

[profile.dev]
debug = "limited"

[profile.release]
lto           = "thin"
codegen-units = 1
