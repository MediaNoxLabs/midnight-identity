#
# Weekly, cooldown-buffered dependency updates targeting `develop`,
# mirroring midnightntwrk/midnight-did's dependabot posture (weekly
# Monday, 7-day cooldown, majors excluded, grouped updates).

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # Majors are reviewed manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    labels:
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
