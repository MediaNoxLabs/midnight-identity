#
# Release / publish pipeline. Trigger: pushing a `v*` tag (e.g. v0.5.1)
# or manual dispatch with dry_run.
#
# Publishable set (dependency order). Today only midnight-did-domain can
# reach crates.io — every other crate depends on the unpublished
# midnight-ledger crates and/or compact-runtime (path deps). When those
# publish upstream, extend PUBLISH_CRATES below in dependency order:
#   midnight-did-domain -> midnight-did-method -> midnight-did-runtime
#   -> midnight-did-api -> midnight-did
# midnight-did-cli and midnight-did-uniffi stay `publish = false` by design.
# See doc/publishing.md for the full policy.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (cargo publish --dry-run, no GitHub Release)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dependency-ordered, space-separated list of crates to publish.
  PUBLISH_CRATES: "midnight-did-domain"

jobs:
  verify:
    name: Verify tag ↔ workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Tag matches workspace.package.version (tag builds only)
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            ws_version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r ".packages[] | select(.name == \"midnight-did-domain\") | .version")
            if [ "v${ws_version}" != "${TAG}" ]; then
              echo "::error::tag ${TAG} != workspace version v${ws_version}"
              exit 1
            fi
          '

      - name: Run gates (fmt + lint + tests) for publishable crates
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            for crate in $PUBLISH_CRATES; do
              cargo fmt -p "$crate" --check
              cargo clippy -p "$crate" --all-targets -- -D warnings
              cargo test -p "$crate" --locked
            done
          '

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: crates-io
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Publish (dependency order, skip already-published versions)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            for crate in $PUBLISH_CRATES; do
              version=$(cargo metadata --format-version 1 --no-deps \
                | jq -r --arg c "$crate" ".packages[] | select(.name == \$c) | .version")
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                echo "::notice::${crate} ${version} already on crates.io — skipping"
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then
                cargo publish -p "$crate" --locked --dry-run
              else
                cargo publish -p "$crate" --locked
              fi
            done
          '

  github-release:
    name: GitHub Release
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
