name: CI

# CI for the midnight-identity workspace. Gates the functional DID crates,
# the umbrella crate and the VC credential model:
#
#   - midnight-did-domain : pure data model, zero midnight-* deps
#   - midnight-did-method : Midnight method profile (did:midnight:*)
#   - midnight-did-api    : operation builders on Contract<B: Backend>
#                           (DidContract trait retired in v0.4.0 — ADR 0008)
#   - midnight-did        : umbrella re-export crate
#   - midnight-vc-domain  : pure-data VC credential model (issue #13)
#
# The codegen-target crates `midnight-did-runtime` and `midnight-vc-runtime`
# are intentionally NOT in the test / wasm-build jobs — they transitively
# depend on halo2 / arkworks crates that do not compile to wasm. They ARE
# exercised by the codegen-check / codegen-vc-check jobs below (regenerate
# the bindings under the flake-pinned compactc and assert no drift).
# `midnight-vc-families` is also a codegen target (same midnight-compact-runtime
# closure, same wasm exclusion) but carries the family smoke tests, so it
# gets its own --all-features test step in the test job.
#
# Every job runs under `nix develop`. The devshell's shellHook
# materialises path-mounted third_party crates (midnight-ledger,
# midnight-zk, compact/runtime-rs, compact/runtime-rs-macros) that the
# workspace Cargo.toml references — without them, bare `cargo` fails at
# `cargo metadata`.
#
# Seven jobs:
#   - pre-check:    cargo fmt --check + clippy -D warnings on Linux.
#   - test:         cargo test --locked on Linux AND macOS.
#   - wasm-build:   cargo build --target wasm32-unknown-unknown on the
#                   wasm-clean crates.
#   - coverage:     cargo-llvm-cov line-coverage floor (see justfile
#                    `coverage_floor`) over every first-party crate.
#   - codegen-check: regen generated.rs against flake-pinned compactc,
#                    assert no drift.
#   - codegen-vc-check: same, for the VC core + credential-family binding
#                    modules (including midnight-vc-families).

on:
  pull_request:
    paths:
      - "crates/midnight-did-domain/**"
      - "crates/midnight-did-method/**"
      - "crates/midnight-did-api/**"
      - "crates/midnight-did/**"
      - "crates/midnight-did-runtime/src/contract/**"
      - "crates/midnight-vc-domain/**"
      - "crates/midnight-vc-families/**"
      - "crates/midnight-vc-runtime/**"
      - "third_party/midnight-did/**"
      - "third_party/midnight-verifiable-credentials/**"
      - "third_party/midnight-verifiable-credential-digital-passport/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "nix/**"
  push:
    branches:
      - rust-codegen
      - develop
    paths:
      - "crates/midnight-did-domain/**"
      - "crates/midnight-did-method/**"
      - "crates/midnight-did-api/**"
      - "crates/midnight-did/**"
      - "crates/midnight-did-runtime/src/contract/**"
      - "crates/midnight-vc-domain/**"
      - "crates/midnight-vc-families/**"
      - "crates/midnight-vc-runtime/**"
      - "third_party/midnight-did/**"
      - "third_party/midnight-verifiable-credentials/**"
      - "third_party/midnight-verifiable-credential-digital-passport/**"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "nix/**"
  workflow_dispatch:

# Default to no permissions; each job opts in to the minimum it needs.
permissions: {}

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Fast pre-checks: formatting + lints. Linux only.
  pre-check:
    name: Format + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (DID gated set + VC crates)
        run: |
          nix develop --command bash -c '
            cargo fmt -p midnight-did-domain   --check &&
            cargo fmt -p midnight-did-method   --check &&
            cargo fmt -p midnight-did-api      --check &&
            cargo fmt -p midnight-did          --check &&
            cargo fmt -p midnight-vc-domain    --check &&
            cargo fmt -p midnight-vc-families  --check &&
            cargo fmt -p midnight-vc-runtime   --check
          '

      - name: Run Clippy on midnight-did-domain
        run: nix develop --command cargo clippy -p midnight-did-domain --all-targets -- -D warnings

      - name: Run Clippy on midnight-did-method
        run: nix develop --command cargo clippy -p midnight-did-method --all-targets -- -D warnings

      - name: Run Clippy on midnight-did-api
        run: nix develop --command cargo clippy -p midnight-did-api --all-targets -- -D warnings

      - name: Run Clippy on midnight-did (umbrella)
        run: nix develop --command cargo clippy -p midnight-did --all-targets -- -D warnings

      - name: Run Clippy on midnight-vc-domain
        run: nix develop --command cargo clippy -p midnight-vc-domain --all-targets -- -D warnings

      # The generated binding modules carry compactc's own #![allow(clippy::all)],
      # so this lints the hand-written lib.rs / contract/mod.rs surface.
      - name: Run Clippy on midnight-vc-runtime
        run: nix develop --command cargo clippy -p midnight-vc-runtime --all-targets -- -D warnings

      # Same surface for the families crate, plus the feature-gated generated
      # bindings and their smoke tests (--all-features: `default = []` there).
      # Kept as its own step so --all-features never touches other crates.
      - name: Run Clippy on midnight-vc-families
        run: nix develop --command cargo clippy -p midnight-vc-families --all-features --all-targets -- -D warnings

  # Test matrix on Linux + macOS.
  test:
    name: Test ${{ matrix.os }}
    needs: pre-check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-target-did-${{ hashFiles('Cargo.lock', 'crates/midnight-did-domain/**', 'crates/midnight-did-method/**', 'crates/midnight-did-api/**') }}
          restore-keys: |
            ${{ runner.os }}-target-did-

      - name: Run tests (domain + method + api + vc-domain)
        run: |
          nix develop --command cargo test --locked \
            -p midnight-did-domain -p midnight-did-method -p midnight-did-api \
            -p midnight-vc-domain

      # The credential-families smoke tests (deterministic fixtures ported
      # from the vendored submodule) live behind the family feature; run them
      # in their own invocation so --all-features stays scoped to this crate.
      - name: Run tests (vc-families, all features)
        run: nix develop --command cargo test --locked -p midnight-vc-families --all-features

  # Build the wasm-clean crates against wasm32-unknown-unknown.
  wasm-build:
    name: WASM target build
    needs: pre-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Cargo registry and wasm target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      # Only midnight-did-domain is wasm-clean today.
      #   - method     -> midnight-base-crypto + midnight-compact-runtime (blst)
      #   - api        -> midnight-did-runtime  (blst via halo2)
      #   - umbrella   -> transitively depends on api/runtime
      # All three drag the `blst` C bindings into the wasm32 build, and
      # blst's `no_asm.h` fails to compile without an `llimb_t` typedef
      # on wasm targets. Restoring method/api/umbrella to the wasm gate
      # is a re-architecting task (feature-gate the crypto deps behind
      # a non-wasm cfg or expose the domain-shape mapping via a smaller
      # runtime-agnostic surface).
      - name: Build wasm32-unknown-unknown (domain)
        run: |
          nix develop --command cargo build --target wasm32-unknown-unknown \
            -p midnight-did-domain \
            --locked

  # Line-coverage gate over every first-party crate (cargo-llvm-cov via
  # the devshell toolchain's llvm-tools). The floor lives in the justfile
  # (`coverage_floor`) so local `just ci` and CI enforce the same number;
  # the ratchet step warns when the floor lags measured coverage by >5.
  # generated.rs (codegen artifact, gated by codegen-check) and bin
  # entrypoints are excluded.
  coverage:
    name: Coverage gate
    needs: pre-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Enforce coverage floor
        run: nix develop --command just coverage-gate

      - name: Ratchet check (warn when the floor is stale)
        run: nix develop --command just coverage-ratchet

      - name: Export LCOV report
        if: always()
        run: nix develop --command just coverage-lcov

      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lcov
          path: target/lcov.info
          retention-days: 14

  # Regenerate generated.rs from did.compact via the flake-pinned compactc
  # and assert no drift against the committed file.
  #
  # `midnightntwrk/midnight-did` went public, so the submodule fetches
  # with the default GITHUB_TOKEN and this gate runs on every PR/push.
  codegen-check:
    name: Codegen regen check (did.compact -> generated.rs)
    needs: pre-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run codegen and assert no drift
        run: nix develop --command just codegen-check

  # Same gate for the VC contracts (issue #13): regenerate the four
  # core binding modules plus the digital-passport family binding (in
  # `midnight-vc-families`) from the pinned sources — the four core modules
  # from the frozen `third_party/midnight-verifiable-credentials` snapshot,
  # the family from the standalone
  # `third_party/midnight-verifiable-credential-digital-passport` repo with
  # its `credential-compact` core fetched inside `just codegen-vc` — and
  # assert no drift against the committed files.
  #
  # Both submodules are public, so they fetch with the default GITHUB_TOKEN —
  # no extra credentials needed.
  codegen-vc-check:
    name: Codegen regen check (VC contracts -> vc-runtime bindings)
    needs: pre-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run VC codegen and assert no drift
        run: nix develop --command just codegen-vc-check
