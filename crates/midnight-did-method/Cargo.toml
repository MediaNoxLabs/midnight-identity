[package]
name                   = "midnight-did-method"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage               = "https://github.com/MediaNoxLabs/midnight-identity"
documentation          = "https://docs.rs/midnight-did-method"
readme                 = "README.md"
description            = "Runtime-independent did:midnight method parsing, network mapping, holder binding, and off-chain encoding."
keywords               = [ "midnight", "did", "did-method", "ssi", "identity" ]
categories             = [ "cryptography", "data-structures" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[lib]
path = "src/lib.rs"

[dependencies]
identus-crypto      = { workspace = true }
midnight-did-domain = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
thiserror           = "2"
hex                 = { workspace = true }
blake2              = "0.10"
