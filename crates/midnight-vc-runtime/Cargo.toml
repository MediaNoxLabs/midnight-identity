[package]
name                   = "midnight-vc-runtime"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description            = "Codegen target for Midnight Verifiable Credentials — Rust bindings emitted from the VC Core credentials.compact."

# `publish = false` per doc/publishing.md: this crate depends on immutable Git
# revisions of the unpublished Compact runtime and Ledger stack. crates.io
# publication remains blocked until those upstream crates publish.
publish = false

[lib]
name = "midnight_vc_runtime"
path = "src/lib.rs"

[dependencies]
# The runtime the generated circuits call into. Its immutable Git revision is
# declared at the workspace root; Nix path substitution is opt-in.
midnight-compact-runtime = { workspace = true }

# Ledger crates the generated code needs at link time (transitively via
# midnight-compact-runtime). The root manifest keeps them on one Git source.
midnight-base-crypto     = { workspace = true }
midnight-onchain-runtime = { workspace = true }
midnight-serialize       = { workspace = true }

[dev-dependencies]
