[package]
name                   = "midnight-vc-families"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description            = "Codegen target for Midnight Verifiable Credentials credential families — Rust bindings emitted from the family prototype contracts (digital-passport today)."

# `publish = false` per doc/publishing.md: like `midnight-vc-runtime`, this
# crate depends on immutable Git revisions of the unpublished Compact runtime
# and Ledger stack. Publishing stays blocked until those upstream crates publish;
# consumers use a Git dependency on this repository.
publish = false

[lib]
name = "midnight_vc_families"
path = "src/lib.rs"

[features]
# One feature per credential family, `default = []`: the family surfaces are
# prototype-grade and churn upstream, so every consumer opts in explicitly
# (design D2). Features are strictly additive — enabling a family never
# changes another enabled family's surface.
default = [  ]

# The digital-passport family binding (types + `pure_circuits`) under
# `contract::digital_passport`.
digital-passport = [  ]

[dependencies]
# The runtime the generated circuits call into. Its immutable Git revision is
# declared at the workspace root; Nix path substitution is opt-in.
midnight-compact-runtime = { workspace = true }

# Ledger crates the generated code needs at link time (transitively via
# midnight-compact-runtime). The root manifest keeps them on one Git source.
midnight-base-crypto     = { workspace = true }
midnight-onchain-runtime = { workspace = true }
midnight-serialize       = { workspace = true }

[dev-dependencies]
# SHA-256 for the deterministic test fixtures ported from the family
# package's `src/testing/credential-fixtures.ts` (openings are
# sha256("opening:<field>") there).
sha2 = "0.10"
# Decode the TS-captured golden vectors in `tests/fixtures/ts-parity.json`.
hex        = { workspace = true }
serde_json = { workspace = true }
