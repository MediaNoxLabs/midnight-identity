[package]
name                   = "midnight-did-runtime"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description            = "Codegen target for the Midnight DID Method — generated.rs, witnesses, controller key. Renamed from `midnight-did` (now an umbrella crate) per ADR 0003."

[lib]
name = "midnight_did_runtime"
path = "src/lib.rs"

[features]
default    = [  ]
http       = [ "dep:reqwest" ]
node-subxt = [ "dep:futures", "dep:subxt", "dep:tokio" ]

[dependencies]
# The immutable Compact runtime revision is declared at the workspace root.
# Its sibling macro crate resolves from the same Git checkout. Nix path
# substitution is available only through the explicit local override wrapper.
midnight-compact-runtime = { workspace = true }

# Ledger workspace dependencies needed by generated.rs and the native backend.
# They are explicit so the public manifest records the complete supported
# Ledger 8 source cone instead of relying only on Compact's transitive edges.
# Every entry resolves from one exact Git revision; Compact's remaining Ledger
# edges are unified by the root patch table.
midnight-base-crypto      = { workspace = true }
midnight-coin-structure   = { workspace = true }
midnight-onchain-runtime  = { workspace = true }
midnight-serialize        = { workspace = true }
midnight-ledger           = { workspace = true }
midnight-storage          = { workspace = true }
midnight-transient-crypto = { workspace = true }
# Forces Compact's broad registry requirements to select the exact Git patches
# above, even when newer source-distinct registry releases exist.
midnight-ledger-source-lock = { workspace = true }

# Sibling first-party crates — R2-2 (v0.4.0) lifts ledger-shape types
# (`DidLedgerSnapshot`, `LedgerVerificationMethod`, `MapMutation`, …) into
# this crate so `DidContractCall` can carry them as variant payloads. The
# api crate now re-exports these for downstream consumers.
midnight-did-domain = { workspace = true }
midnight-did-method = { workspace = true }

# R2-1: async-trait for the I/O-substrate `Backend` trait. Pinned to
# 0.1 to match the version already used by `midnight-did-api`.
async-trait = "0.1"

# R2-2 (v0.4.0): `DidContractCall` is serialised into `BuiltTx::bytes`
# via serde_json so the recording backend can decode the typed envelope.
# blake2 is used by the recording backend to synthesise a deterministic
# `FinalizedTxData::tx_hash` from the envelope bytes.
serde      = { workspace = true }
serde_json = { workspace = true }
hex        = { workspace = true }
blake2     = "0.10"

# R2-3 (architecture-audit Rec #1): validating constructors on
# `JubjubPointHex`, `SchnorrJubjubSignature`, and `SchnorrJubjubDigest`
# return a typed `ValidationError`.
thiserror = "2"
rand      = "0.8"
zeroize   = "1.9"
futures   = { version = "0.3", optional = true }
subxt     = { version = "0.44", optional = true }
tokio     = { version = "1", features = [ "time" ], optional = true }
reqwest   = { version = "0.13", default-features = false, features = [ "json", "rustls" ], optional = true }

[dev-dependencies]
midnight-did-jubjub-schnorr = { workspace = true }
sha2                        = "0.10"
# R2-1: tokio runtime for the `Backend` impls' unit tests (current-thread,
# no IO).
tokio = { version = "1", features = [ "macros", "rt" ] }
